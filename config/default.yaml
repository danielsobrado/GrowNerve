env: development

server:
  address: 127.0.0.1:8080
  shutdown_timeout: 10s
  cors_allowed_origins:
    - http://127.0.0.1:5173
    - http://localhost:5173

postgres:
  url_env: GROWNERVE_DATABASE_URL

mqtt:
  broker: tcp://127.0.0.1:1883
  client_id: grownerve-server

telemetry:
  batch_size: 200
  flush_interval: 1s

media:
  provider: filesystem
  path: ./data/media
