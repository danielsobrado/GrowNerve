env: development

server:
  address: 127.0.0.1:8080
  shutdown_timeout: 10s
  cors_allowed_origins:
    - http://127.0.0.1:5173
    - http://localhost:5173
  # Per-client allowances. Development leaves reads generous and still bounds
  # writes, so the throttling path is exercised locally rather than first
  # discovered in production.
  rate_limit:
    read_per_second: 50
    read_burst: 100
    write_per_second: 10
    write_burst: 20

auth:
  # dev grants an administrator principal with no credential. Configuration
  # validation refuses this mode when env is production.
  mode: dev
  local_accounts_env: GROWNERVE_LOCAL_ACCOUNTS
  oidc:
    role_claim: grownerve_role

postgres:
  url_env: GROWNERVE_DATABASE_URL

mqtt:
  broker: tcp://127.0.0.1:1883
  client_id: grownerve-server
  username_env: GROWNERVE_MQTT_USERNAME
  password_env: GROWNERVE_MQTT_PASSWORD

telemetry:
  batch_size: 200
  flush_interval: 1s
  # Zero keeps every measurement. Set a duration once the deployment has decided
  # how much history it wants to carry.
  retention: 0s

runtime:
  command_sweep_interval: 5s
  alert_interval: 15s
  retention_interval: 1h
  config_sync_interval: 30s
  device_offline_after: 2m

media:
  provider: filesystem
  path: ./data/media
  maximum_bytes: 16777216
