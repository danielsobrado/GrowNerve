; GrowNerve ESP32 reference firmware.
;
; This is the controller half of the phase 8 contract: it persists its
; configuration, keeps essential outputs running when the server is unreachable,
; and fails to a safe state rather than to whatever it was last told.
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor
;
; Secrets are never committed. Copy include/secrets.example.h to
; include/secrets.h and fill it in; that file is git-ignored.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@7.1.0
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -std=gnu++17
build_unflags = -std=gnu++11
