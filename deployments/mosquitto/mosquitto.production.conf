# Production broker. Every controller authenticates and is confined to its own
# topic space, so a compromised device cannot publish telemetry attributed to
# another controller or receive another controller's commands.
persistence true
persistence_location /mosquitto/data/

# TLS only. Provision certificates out of band and mount them read-only.
listener 8883 0.0.0.0
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

# A device that reconnects with an in-flight session must not silently take over
# another client's identity.
per_listener_settings false
max_queued_messages 1000
log_dest stdout
log_type error
log_type warning
log_type notice
