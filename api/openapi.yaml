openapi: 3.1.0
info:
  title: GrowNerve API
  version: 0.1.0
  description: Local-first indoor farm state, telemetry, history, and control contract.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8080
# Every API path requires a bearer credential. The health probes and the version
# endpoint opt out individually, because an orchestrator holds no credential.
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      summary: Check process liveness
      operationId: getLiveness
      security: []
      responses:
        "200":
          description: Process is alive.
          content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } }
  /health/ready:
    get:
      summary: Check dependency readiness
      operationId: getReadiness
      security: []
      responses:
        "200": { description: Required dependencies are ready, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
        "503": { description: A required dependency is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Health" } } } }
  /api/v1/state:
    get:
      summary: Read the complete farm state
      operationId: getFarmState
      responses:
        "200":
          description: Browser-compatible complete farm state.
          headers:
            ETag:
              description: Strong validator for this exact projected response body, including live telemetry.
              schema: { type: string }
            X-Farm-Version:
              description: Opaque optimistic-concurrency version. Echo this header on the next replacement.
              schema: { type: string, pattern: "^[0-9]+$" }
          content: { application/json: { schema: { $ref: "#/components/schemas/FarmState" } } }
        "204": { description: No farm has been configured. }
        "500": { $ref: "#/components/responses/Problem" }
    put:
      summary: Replace the complete farm state
      operationId: replaceFarmState
      description: >-
        Replacing an existing farm requires the X-Farm-Version returned by the
        latest GET. Creating the first farm uses If-None-Match: *. The write,
        registry projection, and imported telemetry commit atomically.
      parameters:
        - in: header
          name: X-Farm-Version
          description: Version returned by the latest successful GET or PUT. Required when replacing existing state.
          required: false
          schema: { type: string, pattern: "^[0-9]+$" }
        - in: header
          name: If-None-Match
          description: Use * when creating the first farm so creation cannot overwrite an existing state.
          required: false
          schema: { type: string, enum: ["*"] }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FarmState" } } }
      responses:
        "204":
          description: Farm state saved.
          headers:
            X-Farm-Version:
              description: New optimistic-concurrency version.
              schema: { type: string, pattern: "^[0-9]+$" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { description: The supplied version or create precondition no longer matches; reload before saving., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { description: Registry identities or imported measurements are invalid; no state is changed., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "428": { description: Existing state cannot be replaced without X-Farm-Version., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/overview:
    get:
      summary: Read the operational overview
      operationId: getOverview
      responses:
        "200": { description: Operational overview projection, content: { application/json: { schema: { $ref: "#/components/schemas/FarmState" } } } }
  /api/v1/facilities:
    get:
      summary: List facilities
      operationId: listFacilities
      responses:
        "200": { description: Facilities, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Facility" } } } } }
  /api/v1/zones:
    get:
      summary: List zones
      operationId: listZones
      responses:
        "200": { description: Zones, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /api/v1/reservoirs:
    get:
      summary: List reservoirs
      operationId: listReservoirs
      responses:
        "200": { description: Reservoirs, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /api/v1/grow-cycles:
    get:
      summary: List grow cycles
      operationId: listGrowCycles
      responses:
        "200": { description: Grow cycles, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /api/v1/devices:
    get:
      summary: List devices
      operationId: listDevices
      responses:
        "200": { description: Devices, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /api/v1/channels:
    get:
      summary: List logical channels
      operationId: listChannels
      responses:
        "200": { description: Logical channels, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /api/v1/measurements:
    get:
      summary: List measurements
      operationId: listMeasurements
      description: The newest measurement per channel. Full history is served by /api/v1/measurements/history.
      responses:
        "200": { description: Latest measurement per channel, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Measurement" } } } } }
  /api/v1/measurements/latest:
    get:
      summary: Read the newest measurement per channel
      operationId: listLatestMeasurements
      responses:
        "200": { description: Latest measurement per channel, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Measurement" } } } } }
  /api/v1/measurements/history:
    get:
      summary: Read bounded measurement history for one channel
      operationId: getMeasurementHistory
      description: >-
        Every read is bounded. Omitting from and to reads the last 24 hours, and
        limit is clamped to the server maximum. Supplying bucketSeconds returns
        server-side aggregates instead of raw samples.
      parameters:
        - { in: query, name: channelId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: from, required: false, schema: { type: string, format: date-time } }
        - { in: query, name: to, required: false, schema: { type: string, format: date-time } }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 5000 } }
        - { in: query, name: bucketSeconds, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Raw samples, or aggregates when bucketSeconds is supplied.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MeasurementPage"
                  - $ref: "#/components/schemas/BucketPage"
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/stream:
    get:
      summary: Subscribe to live change hints
      operationId: streamChanges
      description: >-
        A server-sent-event stream of small invalidation envelopes. It carries no
        farm data: a client is told which topic changed and re-reads it through
        the normal authorized endpoints.
      responses:
        "200":
          description: An open event stream.
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/media:
    post:
      summary: Upload an observation photograph
      operationId: uploadMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Stored object metadata, content: { application/json: { schema: { $ref: "#/components/schemas/MediaObject" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
  /api/v1/media/{id}:
    get:
      summary: Download a stored photograph
      operationId: downloadMedia
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The stored image.
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/events:
    get:
      summary: List farm events
      operationId: listEvents
      responses:
        "200": { description: Farm events, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /api/v1/alerts:
    get:
      summary: List alerts
      operationId: listAlerts
      responses:
        "200": { description: Alerts, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /api/v1/commands:
    get:
      summary: List commands
      operationId: listCommands
      responses:
        "200": { description: Durable commands, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
    post:
      summary: Request a validated device command
      operationId: createCommand
      parameters:
        - in: header
          name: Idempotency-Key
          description: Retry key bound to one normalized command request. Reusing it for different content returns 409.
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetChannelId, value, reason]
              properties:
                targetChannelId: { type: string, format: uuid }
                value: { oneOf: [{ type: number }, { type: boolean }] }
                reason: { type: string, minLength: 1 }
                expiresAt:
                  description: Optional absolute expiry. Command lifetime is capped at five minutes.
                  type: string
                  format: date-time
      responses:
        "202": { description: Command persisted and accepted for delivery, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "200": { description: An idempotent retry of an already-recorded command; the original record is returned., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: Idempotency-Key was previously used for different command content., content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422":
          description: The request was recorded but rejected by a command safety rule. Authorization and safety are separate checks.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "429": { $ref: "#/components/responses/Problem" }
        "500": { $ref: "#/components/responses/Problem" }
  /api/v1/integrations:
    get:
      summary: List integration providers and their connection state
      description: Every known provider is listed; disabled providers report state "disabled". Integration health never affects readiness.
      operationId: listIntegrations
      responses:
        "200": { description: Provider statuses, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/IntegrationStatus" } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/integrations/{provider}/devices:
    parameters:
      - { in: path, name: provider, required: true, schema: { $ref: "#/components/schemas/IntegrationProvider" } }
    get:
      summary: List the devices a provider knows, adopted or not
      description: Requires a manager. A provider inventory, particularly Home Assistant's, can describe a whole home.
      operationId: listDiscoveredDevices
      responses:
        "200": { description: Discovered devices, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DiscoveredDevice" } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/integrations/{provider}/devices/{externalId}/adopt:
    parameters:
      - { in: path, name: provider, required: true, schema: { $ref: "#/components/schemas/IntegrationProvider" } }
      - in: path
        name: externalId
        required: true
        description: Provider identity, such as a Zigbee IEEE address.
        schema: { type: string, minLength: 1, maxLength: 256 }
    post:
      summary: Adopt a discovered device as a farm device with channels
      description: >
        Creates the device, one channel per chosen capability and their bindings in one committed write. Channel kind, value
        type, unit and range come from the provider capability. Adopting any command capability requires
        acknowledge_no_edge_failsafe because consumer devices have no controller-side failsafe (ADR-039).
      operationId: adoptDiscoveredDevice
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdoptRequest" } } }
      responses:
        "201": { description: Device adopted, content: { application/json: { schema: { $ref: "#/components/schemas/AdoptResult" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/integrations/{provider}/permit-join:
    parameters:
      - { in: path, name: provider, required: true, schema: { $ref: "#/components/schemas/IntegrationProvider" } }
    post:
      summary: Open the provider's network to new devices
      description: Administrator only. Supported by zigbee2mqtt; seconds 0 closes the network.
      operationId: permitJoin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seconds]
              properties:
                seconds: { type: integer, minimum: 0, maximum: 254 }
      responses:
        "202":
          description: Join window requested
          content:
            application/json:
              schema: { type: object, required: [until], properties: { until: { type: string, format: date-time } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
components:
  schemas:
    IntegrationProvider:
      type: string
      enum: [zigbee2mqtt, matter, home_assistant]
    DeviceIntegration:
      description: Present on a farm device that an integration manages.
      type: object
      required: [provider, external_id, adopted_at]
      properties:
        provider: { $ref: "#/components/schemas/IntegrationProvider" }
        external_id: { type: string, minLength: 1, maxLength: 256 }
        manufacturer: { type: string }
        model: { type: string }
        adopted_at: { type: string, format: date-time }
    IntegrationStatus:
      type: object
      required: [provider, enabled, state, since, device_count, adopted_count, permit_join_supported]
      properties:
        provider: { $ref: "#/components/schemas/IntegrationProvider" }
        enabled: { type: boolean }
        state: { type: string, enum: [disabled, connecting, connected, degraded, error] }
        detail: { type: string }
        since: { type: string, format: date-time }
        device_count: { type: integer, minimum: 0 }
        adopted_count: { type: integer, minimum: 0 }
        permit_join_supported: { type: boolean }
        permit_join_until: { type: string, format: date-time }
    IntegrationCapability:
      type: object
      required: [key, label, kind, value_type, unit, suggested_channel_key]
      properties:
        key: { type: string, description: "Becomes the channel's integration_key." }
        label: { type: string }
        kind: { type: string, enum: [measurement, state, command] }
        value_type: { type: string, enum: [number, boolean] }
        unit: { type: string }
        dimension: { type: string }
        minimum: { type: number }
        maximum: { type: number }
        suggested_channel_key: { type: string }
        diagnostic: { type: boolean }
        note: { type: string }
    DiscoveredDevice:
      type: object
      required: [provider, external_id, name, suggested_type, available, capabilities]
      properties:
        provider: { $ref: "#/components/schemas/IntegrationProvider" }
        external_id: { type: string }
        name: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        firmware: { type: string }
        power_source: { type: string, enum: [battery, mains] }
        suggested_type: { type: string, enum: [controller, light, fan, air_pump, sensor] }
        available: { type: boolean }
        capabilities: { type: array, items: { $ref: "#/components/schemas/IntegrationCapability" } }
        adopted_device_id: { type: string, format: uuid }
    AdoptRequest:
      type: object
      additionalProperties: false
      required: [zone_id, channels]
      properties:
        zone_id: { type: string }
        name: { type: string }
        type: { type: string, enum: [controller, light, fan, air_pump, sensor] }
        acknowledge_no_edge_failsafe: { type: boolean }
        channels:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AdoptChannel" }
    AdoptChannel:
      type: object
      additionalProperties: false
      required: [capability_key]
      properties:
        capability_key: { type: string }
        key: { type: string, description: "Farm channel key; defaults to the capability's suggestion. Unique per facility." }
        name: { type: string }
        entity_type: { type: string, enum: [facility, zone, reservoir, grow_cycle, plant_position, device, channel, inventory_item] }
        entity_id: { type: string }
        stale_after_seconds: { type: integer, minimum: 1 }
        safe_minimum: { type: number }
        safe_maximum: { type: number }
    AdoptResult:
      type: object
      required: [device, channels]
      properties:
        device: { type: object, additionalProperties: true }
        channels: { type: array, items: { type: object, additionalProperties: true } }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string }
        checks: { type: object, additionalProperties: { type: string } }
    Facility:
      type: object
      required: [id, name, timezone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        timezone: { type: string, minLength: 1 }
    FarmState:
      type: object
      additionalProperties: false
      required: [facilities, zones, reservoirs, crops, varieties, grow_cycles, plant_positions, recipes, recipe_versions, recipe_stages, setpoints, devices, channels, channel_bindings, measurements, events, event_quantities, observations, inventory_items, inventory_adjustments, harvests, alerts, commands, automation_rules, scene_layouts]
      properties:
        facilities: { type: array, items: { $ref: "#/components/schemas/Facility" } }
        zones: { type: array, items: { type: object, additionalProperties: true } }
        reservoirs: { type: array, items: { type: object, additionalProperties: true } }
        crops: { type: array, items: { type: object, additionalProperties: true } }
        varieties: { type: array, items: { type: object, additionalProperties: true } }
        grow_cycles: { type: array, items: { type: object, additionalProperties: true } }
        plant_positions: { type: array, items: { type: object, additionalProperties: true } }
        recipes: { type: array, items: { type: object, additionalProperties: true } }
        recipe_versions: { type: array, items: { type: object, additionalProperties: true } }
        recipe_stages: { type: array, items: { type: object, additionalProperties: true } }
        setpoints: { type: array, items: { type: object, additionalProperties: true } }
        devices: { type: array, items: { type: object, additionalProperties: true } }
        channels: { type: array, items: { type: object, additionalProperties: true } }
        channel_bindings: { type: array, items: { type: object, additionalProperties: true } }
        measurements: { type: array, items: { type: object, additionalProperties: true } }
        events: { type: array, items: { type: object, additionalProperties: true } }
        event_quantities: { type: array, items: { type: object, additionalProperties: true } }
        observations: { type: array, items: { type: object, additionalProperties: true } }
        inventory_items: { type: array, items: { type: object, additionalProperties: true } }
        inventory_adjustments: { type: array, items: { type: object, additionalProperties: true } }
        harvests: { type: array, items: { type: object, additionalProperties: true } }
        alerts: { type: array, items: { type: object, additionalProperties: true } }
        commands: { type: array, items: { type: object, additionalProperties: true } }
        automation_rules: { type: array, items: { type: object, additionalProperties: true } }
        scene_layouts: { type: array, items: { type: object, additionalProperties: true } }
    Measurement:
      type: object
      required: [channel_id, observed_at, value, unit, quality]
      properties:
        id: { type: string, format: uuid }
        channel_id: { type: string, format: uuid }
        observed_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        sequence: { type: integer, format: int64 }
        value: { type: number }
        unit: { type: string, minLength: 1 }
        quality: { type: string, enum: [good, suspect, stale, calibrating, fault, unknown] }
        source_device_id: { type: string, format: uuid }
    MeasurementPage:
      type: object
      required: [channelId, measurements]
      properties:
        channelId: { type: string, format: uuid }
        measurements: { type: array, items: { $ref: "#/components/schemas/Measurement" } }
    Bucket:
      type: object
      required: [started_at, average, minimum, maximum, samples]
      properties:
        started_at: { type: string, format: date-time }
        average: { type: number }
        minimum: { type: number }
        maximum: { type: number }
        samples: { type: integer, format: int64 }
    BucketPage:
      type: object
      required: [channelId, bucketSeconds, buckets]
      properties:
        channelId: { type: string, format: uuid }
        bucketSeconds: { type: integer }
        buckets: { type: array, items: { $ref: "#/components/schemas/Bucket" } }
    MediaObject:
      type: object
      required: [id, filename, mime_type, size_bytes, sha256, created_at]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        mime_type: { type: string, enum: ["image/jpeg", "image/png", "image/webp", "image/gif"] }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string }
        created_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        correlationId: { type: string }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        A local-mode token or an OIDC access token. The server decides
        authorization from the principal's role; a permitted request can still be
        refused by a safety interlock.
  responses:
    Problem:
      description: Stable problem details response.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
