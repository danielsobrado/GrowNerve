name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  GO_VERSION: "1.25.13"
  NODE_VERSION: "22.13.0"

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.13", cache: true }
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal db)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Tests with race and coverage
        run: go test -race -coverprofile=coverage.out ./...
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.13.0", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Generate API types and verify drift
        working-directory: frontend
        run: npm run gen:api && git diff --exit-code -- src/lib/api/generated/schema.d.ts
      - name: Typecheck, lint, unit coverage
        working-directory: frontend
        run: npm run typecheck && npm run lint && npm run test:coverage
      - name: Server and Pages builds
        working-directory: frontend
        run: npm run build && npm run build:browser

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.13.0", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser journeys
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: grownerve_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d grownerve_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grownerve_test?sslmode=disable
      GROWNERVE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/grownerve_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25.13", cache: true }
      - name: Migrate up, down, up
        run: go run ./cmd/migrate up && go run ./cmd/migrate down && go run ./cmd/migrate up
      - name: Integration tests
        run: go test -race ./...

  images:
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality, browser-e2e, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: "grownerve:${{ github.sha }}" }
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t grownerve-frontend:${{ github.sha }} frontend
