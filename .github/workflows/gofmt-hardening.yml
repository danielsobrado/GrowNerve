name: Gofmt Hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
      - name: Normalize sources
        run: |
          gofmt -w cmd internal db
          python3 - <<'PY'
          from pathlib import Path
          path = Path("frontend/src/screens/screens.tsx")
          text = path.read_text()
          broken = 'setError(cause instanceof Error ? cause.message : "Import failed"; }'
          fixed = 'setError(cause instanceof Error ? cause.message : "Import failed"); }'
          if broken in text:
              path.write_text(text.replace(broken, fixed))
          PY
      - name: Commit normalization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd internal db frontend/src/screens/screens.tsx
          git commit -m "chore: normalize hardening changes"
          git push
