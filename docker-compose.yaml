services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: grownerve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:${GROWNERVE_POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deployments/docker/init-database.sql:/docker-entrypoint-initdb.d/001-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grownerve"]
      interval: 3s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports: ["127.0.0.1:${GROWNERVE_MQTT_PORT:-1883}:1883"]
    volumes:
      - ./deployments/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 12

  migrate:
    image: golang:1.25.13-alpine
    working_dir: /src
    volumes: [".:/src"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/grownerve?sslmode=disable
    command: ["go", "run", "./cmd/migrate", "up"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    environment:
      GROWNERVE_DATABASE_URL: postgresql://grownerve_app:app_password@postgres:5432/grownerve?sslmode=disable
      APP_SERVER__ADDRESS: 0.0.0.0:8080
      APP_MQTT__BROKER: tcp://mosquitto:1883
      # Development authentication. A production process refuses to start in
      # this mode; see config/production.example.yaml.
      APP_AUTH__MODE: ${APP_AUTH__MODE:-dev}
      GROWNERVE_LOCAL_ACCOUNTS: ${GROWNERVE_LOCAL_ACCOUNTS:-}
      APP_TELEMETRY__RETENTION: ${APP_TELEMETRY__RETENTION:-}
      APP_MEDIA__PATH: /var/lib/grownerve/media
      APP_INTEGRATIONS__ZIGBEE2MQTT__ENABLED: ${APP_INTEGRATIONS__ZIGBEE2MQTT__ENABLED:-false}
    volumes:
      - media-data:/var/lib/grownerve/media
    ports: ["127.0.0.1:${GROWNERVE_API_PORT:-8080}:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mosquitto: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app/grownerve-api", "-health-check"]
      disable: true

  simulator:
    profiles: ["simulator"]
    image: golang:1.25.13-alpine
    working_dir: /src
    volumes: [".:/src"]
    command: ["go", "run", "./cmd/device-simulator", "-broker", "tcp://mosquitto:1883"]
    depends_on:
      mosquitto: { condition: service_healthy }

  # Zigbee through Zigbee2MQTT (docs/28-integrations.md). Set
  # APP_INTEGRATIONS__ZIGBEE2MQTT__ENABLED=true on the api service. The
  # coordinator is reached over the network (ZIGBEE_SERIAL_PORT, e.g.
  # tcp://192.168.1.40:6638); for a USB stick add the zigbee-usb override file.
  zigbee2mqtt:
    profiles: ["zigbee"]
    image: koenkk/zigbee2mqtt:2.6.1
    environment:
      TZ: ${TZ:-UTC}
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto:1883
      ZIGBEE2MQTT_CONFIG_MQTT_BASE_TOPIC: zigbee2mqtt
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: ${ZIGBEE_SERIAL_PORT:-tcp://127.0.0.1:6638}
      ZIGBEE2MQTT_CONFIG_SERIAL_ADAPTER: ${ZIGBEE_SERIAL_ADAPTER:-zstack}
      ZIGBEE2MQTT_CONFIG_AVAILABILITY_ENABLED: "true"
      ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED: "false"
      ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED: "true"
      ZIGBEE2MQTT_CONFIG_FRONTEND_PORT: "8081"
    ports: ["127.0.0.1:${ZIGBEE2MQTT_FRONTEND_PORT:-8081}:8081"]
    volumes:
      - zigbee2mqtt-data:/app/data
    depends_on:
      mosquitto: { condition: service_healthy }

  # A simulated Zigbee2MQTT bridge (climate sensor, plug, dimmable light) for
  # working on the integration without a coordinator.
  zigbee-sim:
    profiles: ["zigbee-sim"]
    image: golang:1.25.13-alpine
    working_dir: /src
    volumes: [".:/src"]
    command: ["go", "run", "./cmd/device-simulator", "-mode", "z2m", "-broker", "tcp://mosquitto:1883"]
    depends_on:
      mosquitto: { condition: service_healthy }

volumes:
  zigbee2mqtt-data:
  postgres-data:
  mosquitto-data:
  media-data:
